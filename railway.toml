# ═══════════════════════════════════════════════════════════════
# NIRIUM PROTOCOL — RAILWAY DEPLOYMENT CONFIG (MONOREPO)
# Orchestrates Master Process + Indexer + Swarm Agents
# ═══════════════════════════════════════════════════════════════

[build]
builder = "nixpacks"
buildCommand = "pnpm install && cd packages/agent && pnpm build"
watchPatterns = ["/packages/agent/**", "package.json", "pnpm-lock.yaml", "vercel.json", "railway.toml"]

[deploy]
# Start command — orchestrates all services via master process
startCommand = "cd packages/agent && node dist/src/scripts/master.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicy = "on-failure"
restartPolicyMaxRetries = 10

# ═══════════════════════════════════════════════════════════════
# Environmental Infrastructure
# ═══════════════════════════════════════════════════════════════
[env]
NODE_ENV = "production"
PORT = "3001"
AGENT_PORT = "3002"
# ═══════════════════════════════════════════════════════════════
