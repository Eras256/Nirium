# ═══════════════════════════════════════════════════════════════
# NIRIUM PROTOCOL — RAILWAY DEPLOYMENT CONFIG (HARDENED)
# Isolated Agent Build — Skipping Web/USB Dependencies
# ═══════════════════════════════════════════════════════════════

[build]
builder = "nixpacks"
# Usamos --filter @nirium/agent... para instalar solo al agente y sus dependencias internas
buildCommand = "pnpm install --filter @nirium/agent... && cd packages/agent && pnpm build"
watchPatterns = ["/packages/agent/**", "package.json", "pnpm-lock.yaml", "railway.toml"]

[deploy]
startCommand = "cd packages/agent && node dist/src/scripts/master.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicy = "on-failure"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
AGENT_PORT = "3002"
