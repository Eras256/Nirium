[workspace]
resolver = "2"
members = [
    "verifier",
    "identity-pool",
    "payment-gate",
    "sentinel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nirium/contracts"
authors = ["Nirium Team"]

[workspace.dependencies]
# Soroban SDK - Protocol 25 compatible
soroban-sdk = "22.0.0"

# Testing utilities
soroban-sdk-macros = "22.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
